name: Five-site Search Discovery Audit
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_search_discovery.py"
      - "tests/test_audit_search_discovery.py"
      - ".github/workflows/search-discovery-audit.yml"
  pull_request:
    paths:
      - "scripts/audit_search_discovery.py"
      - "tests/test_audit_search_discovery.py"
      - ".github/workflows/search-discovery-audit.yml"
  schedule:
    - cron: "15 21 * * 1"
permissions:
  contents: read
jobs:
  discovery-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -p "test_audit_search_discovery.py" -v
      - name: Check five public sites and shared sitemap
        run: python scripts/audit_search_discovery.py
      - name: Save detailed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-site-discovery-evidence
          path: seo-discovery-evidence/report.json
          retention-days: 30
